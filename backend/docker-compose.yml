# Untested: Docker was not available when this was written.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: legal_rights
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal_rights"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://legal:${POSTGRES_PASSWORD}@db:5432/legal_rights
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  pgdata:
